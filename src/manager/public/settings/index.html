<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>系統設定｜水手 會員管理系統</title>
    <link rel="stylesheet" href="/assets/shared.css" />
    <link rel="stylesheet" href="/assets/settings.css" />
  </head>
  <body>
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    <div class="layout">
      <aside>
        <h1>水手 會員管理系統</h1>
        <a id="nav-members" href="/members">會員</a>
        <div class="nav-group" data-nav-key="行銷">
          <button class="nav-group-title" type="button" aria-expanded="true">行銷</button>
          <div class="nav-group-items"><div class="nav-group-items-inner">
          <a id="nav-promotions" href="/promotions">優惠活動</a>
          <a id="nav-coupons" href="/coupons">優惠券</a>
          <a id="nav-banners" href="/banners">Banner</a>
          </div></div>
        </div>
        <div class="nav-group" data-nav-key="設定">
          <button class="nav-group-title" type="button" aria-expanded="true">設定</button>
          <div class="nav-group-items"><div class="nav-group-items-inner">
          <a id="nav-branches" href="/branches">分店</a>
          <a id="nav-vips" href="/vips">VIP 規則</a>
          <a id="nav-settings" class="active" href="/settings">系統設定</a>
          </div></div>
        </div>
        <button class="link" id="logout-btn" type="button" onclick="localStorage.removeItem('managerToken');location.replace('/manager/')">登出</button>

        <div class="who" id="who"></div>
      </aside>
      <main>
        <div class="page-head">
          <h2>系統設定</h2>
        </div>
        <form id="settings-form">
          <div class="panel">
            <div class="section-head">
              <h3>時間設定</h3>
            </div>
            <label for="settings-timezone">時區</label>
            <input id="settings-timezone" name="timezone" required placeholder="Asia/Taipei" />
            <p class="hint">之後其他跟時間有關的規則也會放在這裡。預設是台北時間。</p>
            <p class="error" id="settings-error"></p>
            <div class="modal-actions">
              <button type="submit" id="settings-save-btn">儲存</button>
            </div>
          </div>
          <div class="panel hidden" aria-hidden="true">
            <div class="section-head">
              <h3>訂購老鼠</h3>
            </div>
            <div class="settings-grid">
              <div>
                <label for="settings-deadline-weekday">收單截止（星期）</label>
                <select id="settings-deadline-weekday" name="deadlineWeekday" required>
                  <option value="0">週日</option>
                  <option value="1">週一</option>
                  <option value="2">週二</option>
                  <option value="3">週三</option>
                  <option value="4">週四</option>
                  <option value="5">週五</option>
                  <option value="6">週六</option>
                </select>
              </div>
              <div>
                <label for="settings-deadline-time">截止時間</label>
                <input id="settings-deadline-time" name="deadlineTime" type="time" required />
              </div>
              <div>
                <label for="settings-arrive-weekday">到貨（星期）</label>
                <select id="settings-arrive-weekday" name="arriveWeekday" required>
                  <option value="0">週日</option>
                  <option value="1">週一</option>
                  <option value="2">週二</option>
                  <option value="3">週三</option>
                  <option value="4">週四</option>
                  <option value="5">週五</option>
                  <option value="6">週六</option>
                </select>
              </div>
              <div>
                <label for="settings-arrive-offset">到貨再延後幾週</label>
                <input id="settings-arrive-offset" name="arriveOffsetWeeks" type="number" min="0" max="8" step="1" required />
              </div>
            </div>
          </div>
        </form>
          <div class="panel">
            <div class="section-head">
              <h3>排程模擬</h3>
            </div>
            <p class="hint">
              VIP 升降級：每天 12:00（台北）。點數回饋：每天 12:05，依各筆交易當日 VIP 計算，同一會員合併成一筆回饋交易。
            </p>
            <p class="error" id="vip-sync-error"></p>
            <p class="hint" id="vip-sync-result"></p>
            <div class="modal-actions">
              <button type="button" id="vip-sync-btn">立即執行 VIP 升降級掃描</button>
            </div>
            <p class="error" id="cashback-sync-error"></p>
            <p class="hint" id="cashback-sync-result"></p>
            <div class="modal-actions">
              <button type="button" id="cashback-sync-btn">立即執行點數回饋掃描</button>
            </div>
          </div>
      </main>
    </div>
    <script src="/assets/shared.js"></script>
    <script src="/assets/settings.js"></script>
  </body>
</html>
