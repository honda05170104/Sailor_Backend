<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>物種｜水手 會員管理系統</title>
    <link rel="stylesheet" href="/shared/shared.css" />
    <link rel="stylesheet" href="/species/species.css" />
  </head>
  <body>
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    <div class="layout">
      <aside>
        <h1>水手 會員管理系統</h1>
        <div class="nav-group" data-nav-key="會員">
          <button class="nav-group-title" type="button" aria-expanded="true">會員</button>
          <div class="nav-group-items"><div class="nav-group-items-inner">
          <a id="nav-members" href="/members">會員管理</a>
          <a id="nav-messages" href="/messages">群發訊息</a>
          </div></div>
        </div>
        <div class="nav-group" data-nav-key="行銷">
          <button class="nav-group-title" type="button" aria-expanded="true">行銷</button>
          <div class="nav-group-items"><div class="nav-group-items-inner">
          <a id="nav-promotions" href="/promotions">優惠活動</a>
          <a id="nav-coupons" href="/coupons">優惠券</a>
          </div></div>
        </div>
        <div class="nav-group" data-nav-key="物種">
          <button class="nav-group-title" type="button" aria-expanded="true">物種</button>
          <div class="nav-group-items"><div class="nav-group-items-inner">
          <a id="nav-species" class="active" href="/species">物種</a>
          <a id="nav-species-reviews" href="/species-reviews">送審</a>
          </div></div>
        </div>
        <div class="nav-group" data-nav-key="設定">
          <button class="nav-group-title" type="button" aria-expanded="true">設定</button>
          <div class="nav-group-items"><div class="nav-group-items-inner">
          <a id="nav-branches" href="/branches">分店</a>
          <a id="nav-vips" href="/vips">VIP 規則</a>
          <a id="nav-settings" href="/settings">系統設定</a>
          </div></div>
        </div>
        <button class="link" id="logout-btn" type="button">登出</button>

        <div class="who" id="who"></div>
      </aside>
      <main>
        <div class="page-head">
          <h2>物種</h2>
          <button id="species-open-btn" type="button">新增大類</button>
        </div>
        <div id="species-board" class="species-board">
          <p class="empty">尚無大類</p>
        </div>
      </main>
    </div>

    <div id="species-modal" class="modal-backdrop hidden">
      <form class="modal" id="species-form">
        <h3 id="species-modal-title">新增大類</h3>
        <p class="hint" id="species-parent-hint"></p>
        <label for="species-name">名稱</label>
        <input id="species-name" name="name" required />
        <label for="species-sort">排序</label>
        <input id="species-sort" name="sortOrder" type="number" step="1" value="0" />
        <label class="check">
          <input id="species-enabled" name="enabled" type="checkbox" checked />
          啟用
        </label>
        <p class="error" id="species-error"></p>
        <div class="modal-actions">
          <button class="ghost danger hidden" id="species-delete-btn" type="button">刪除</button>
          <span class="modal-actions-spacer"></span>
          <button class="ghost" id="species-cancel-btn" type="button">取消</button>
          <button type="submit" id="species-submit-btn">新增</button>
        </div>
      </form>
    </div>

    <script src="/shared/shared.js"></script>
    <script src="/species/species.js"></script>
  </body>
</html>
