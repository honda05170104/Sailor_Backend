<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banner｜水手 會員管理系統</title>
    <link rel="stylesheet" href="/shared/shared.css" />
    <link rel="stylesheet" href="/banners/banners.css" />
  </head>
  <body>
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    <div class="layout">
      <aside>
        <h1>水手 會員管理系統</h1>
        <a id="nav-members" href="/members">會員</a>
        <div class="nav-group" data-nav-key="行銷">
          <button class="nav-group-title" type="button" aria-expanded="true">行銷</button>
          <div class="nav-group-items"><div class="nav-group-items-inner">
          <a id="nav-promotions" href="/promotions">優惠活動</a>
          <a id="nav-coupons" href="/coupons">優惠券</a>
          <a id="nav-banners" class="active" href="/banners">Banner</a>
          </div></div>
        </div>
        <div class="nav-group" data-nav-key="設定">
          <button class="nav-group-title" type="button" aria-expanded="true">設定</button>
          <div class="nav-group-items"><div class="nav-group-items-inner">
          <a id="nav-branches" href="/branches">分店</a>
          <a id="nav-vips" href="/vips">VIP 規則</a>
          <a id="nav-settings" href="/settings">系統設定</a>
          </div></div>
        </div>
        <button class="link" id="logout-btn" type="button">登出</button>

        <div class="who" id="who"></div>
      </aside>
      <main>
        <div class="page-head">
          <h2>Banner</h2>
          <button id="banner-open-btn" type="button" onclick="document.getElementById('banner-modal').classList.remove('hidden')">新增</button>
        </div>
        <div class="panel">
          <table>
            <thead>
              <tr>
                <th>預覽</th>
                <th>連結</th>
                <th>排序</th>
                <th>狀態</th>
              </tr>
            </thead>
            <tbody id="banner-rows">
              <tr>
                <td colspan="4" class="empty">尚無 Banner</td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>

    <div id="banner-modal" class="modal-backdrop hidden">
      <form class="modal" id="banner-form">
        <h3 id="banner-modal-title">新增 Banner</h3>
        <label class="check">
          <input id="banner-enabled" name="enabled" type="checkbox" checked />
          啟用
        </label>
        <label for="banner-link">連結</label>
        <input id="banner-link" name="linkUrl" placeholder="https://" />
        <label for="banner-sort">排序</label>
        <input id="banner-sort" name="sortOrder" type="number" step="1" value="0" />
        <label for="banner-image">圖片</label>
        <input id="banner-image" name="file" type="file" accept="image/*" />
        <div id="banner-preview-wrap" class="hidden">
          <img id="banner-preview" class="banner-preview" alt="" />
        </div>
        <p class="error" id="banner-error"></p>
        <div class="modal-actions">
          <button class="ghost danger hidden" id="banner-delete-btn" type="button">刪除</button>
          <span class="modal-actions-spacer"></span>
          <button class="ghost" id="banner-cancel-btn" type="button">取消</button>
          <button type="submit" id="banner-submit-btn">新增</button>
        </div>
      </form>
    </div>

    <script src="/shared/shared.js"></script>
    <script src="/banners/banners.js"></script>
  </body>
</html>
