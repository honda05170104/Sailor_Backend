<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>會員等級｜水手 會員管理系統</title>
    <link rel="stylesheet" href="/shared/shared.css" />
    <link rel="stylesheet" href="/vips/vips.css" />
  </head>
  <body>
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    <div class="layout">
      <aside>
        <h1>水手 會員管理系統</h1>
        <a id="nav-members" href="/members">會員</a>
        <a id="nav-branches" href="/branches">分店</a>
        <a id="nav-vips" class="active" href="/vips">會員等級</a>
        <a id="nav-coupons" href="/coupons">優惠券</a>
        <a id="nav-products" href="/products">物種</a>
        <a id="nav-mice" href="/mice">老鼠訂單</a>
        <a id="nav-settings" href="/settings">系統設定</a>
        <button class="link" id="logout-btn" type="button">登出</button>
        <div class="who" id="who"></div>
      </aside>
      <main>
        <div class="page-head">
          <h2>會員等級</h2>
          <button id="vip-open-btn" type="button" onclick="document.getElementById('vip-modal').classList.remove('hidden')">新增</button>
        </div>
        <div class="panel">
          <table>
            <thead>
              <tr>
                <th>名稱</th>
                <th>代碼</th>
                <th>等級</th>
                <th>消費門檻</th>
              </tr>
            </thead>
            <tbody id="vip-rows">
              <tr>
                <td colspan="4" class="empty">尚無會員等級</td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>

    <div id="vip-modal" class="modal-backdrop hidden">
      <form class="modal" id="vip-form">
        <h3 id="vip-modal-title">新增會員等級</h3>
        <label for="vip-name">名稱</label>
        <input id="vip-name" name="name" required />
        <label for="vip-slug">代碼</label>
        <input id="vip-slug" name="slug" placeholder="gold" />
        <label for="vip-rank">等級</label>
        <input id="vip-rank" name="rank" type="number" min="1" step="1" required />
        <label for="vip-min-spend">消費門檻</label>
        <input id="vip-min-spend" name="minSpend" type="number" min="0" step="1" value="0" />
        <p class="hint">代碼空白會依名稱自動產生。等級數字越大越高，消費門檻用來自動升級。</p>
        <p class="error" id="vip-error"></p>
        <div class="modal-actions">
          <button class="ghost" id="vip-cancel-btn" type="button" onclick="document.getElementById('vip-modal').classList.add('hidden')">取消</button>
          <button type="submit" id="vip-submit-btn">新增</button>
        </div>
      </form>
    </div>

    <script src="/shared/shared.js"></script>
    <script src="/vips/vips.js"></script>
  </body>
</html>
